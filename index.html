<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
      }
      canvas {
        border: 4px solid blue;
        background: black;
      }
      .info-group {
        border: 2px solid gray;
        padding: 10px;
        margin-bottom: 10px;
      }
      .info-label {
        font-size: 14px;
      }
      .info-val {
        font-size: 24px;
        font-weight: bold;
        margin-top: 5px;
      }
      .container {
        display: flex;
        gap: 20px;
      }
      .panel {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        font-size: 18px;
        width: 160px;
      }
    </style>
  </head>
  <body>
    <h2>TETRIS</h2>
    <div class="container">
      <canvas id="game" width="300px" height="600px"></canvas>
      <div class="panel">
        <div class="info-group">
          <div class="info-label">SCORE</div>
          <div id="scores" class="info-val">0</div>
        </div>
        <div class="info-group">
          <div class="info-label">LINES</div>
          <div id="lines" class="info-val">0</div>
        </div>
      </div>
    </div>
    <script src="./tetris.js"></script>
  </body>
</html>
