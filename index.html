<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background: #202124;
        color: #fff;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        display: flex;
        gap: 20px;
      }
      canvas {
        border: 4px solid #3c4043;
        background: #000;
      }
      .panel {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        font-size: 18px;
        width: 160px;
      }
      .info-group {
        border: 2px solid #3c4043;
        padding: 10px;
        margin-bottom: 10px;
        background: #282a2d;
      }
      .info-label {
        color: #9aa0a6;
        font-size: 14px;
      }
      .info-val {
        font-size: 24px;
        font-weight: bold;
        color: #8ab4f8;
        margin-top: 5px;
      }
      .controls-container {
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        gap: 20px;
        font-family: sans-serif;
      }
      .controls {
        font-size: 12px;
        color: #9aa0a6;
        line-height: 1.6;
      }
      kbd {
        background: #3c4043;
        padding: 2px 4px;
        border-radius: 3px;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h2>TETRIS</h2>
    <div class="container">
      <canvas id="game" width="300px" height="600px"></canvas>
      <div class="panel">
        <div class="info-group">
          <div class="info-label">SCORE</div>
          <div id="scores" class="info-val">0</div>
        </div>
        <div class="info-group">
          <div class="info-label">LINES</div>
          <div id="lines" class="info-val">0</div>
        </div>
        <div class="info-group">
          <div class="info-label">LEVEL</div>
          <div id="level" class="info-val">1</div>
        </div>
      </div>

      <div class="controls-container">
        <div class="controls" lang="zh">
          <strong>操作指南:</strong><br />
          <kbd>←</kbd> <kbd>→</kbd> : 左右移动<br />
          <kbd>↑</kbd> : 顺时针旋转<br />
          <kbd>↓</kbd> : 软降加速<br />
        </div>

        <div class="controls" lang="en">
          <strong>Controls:</strong><br />
          <kbd>←</kbd> <kbd>→</kbd> : Move Left / Right<br />
          <kbd>↑</kbd> : Rotate Clockwise<br />
          <kbd>↓</kbd> : Soft Drop<br />
        </div>
      </div>
    </div>
    <script src="./tetris.js"></script>
  </body>
</html>
